  <main>
    <h2>Búsqueda de productos</h2>

      <label for="texto-busqueda">¿Qué producto buscas?</label>
      <input type="text" id="texto-busqueda" name="q" placeholder="Ejemplo: routers" autocomplete="off">
      <button type="submit" class="btn">Buscar</button>
    </form>

    <section class="panel" id="resultados" aria-live="polite">
      <p>Escribe un producto y presiona Buscar.</p>
    </section>
