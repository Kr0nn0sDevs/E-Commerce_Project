<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Busca productos en TechHub.">
  <title>Búsqueda | TechHub</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="logo" href="index.html">Tech<span>Hub</span></a>
      <nav aria-label="Navegación principal">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="registro.html">Registro</a></li>
          <li><a href="nosotras.html">Quiénes somos</a></li>
          <li><a href="catalogo.html">Catálogo</a></li>
          <li><a href="busqueda.html" class="activo">Búsqueda</a></li>
          <li><a href="carrito.html">Carrito <span id="cart-counter">(0)</span></a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h2>Búsqueda de productos</h2>
    <div class="form-container">
      <form id="form-busqueda" class="flex-form">
        <label for="input-busqueda" class="sr-only">Buscar productos</label>
        <input type="text" id="input-busqueda" placeholder="Ej. camisas, tarjetas, routers">
        <button type="submit" class="btn">Buscar</button>
      </form>
    </div>

    <section id="area-resultados" class="resultados-area" hidden>
      <h3 id="texto-resultados"></h3>
      
      <div class="productos">
        
        <article class="producto">
          <img src="img/cpu.jpg" alt="Producto de prueba 1">
          <div class="producto-info">
            <h3>Procesador Básico</h3>
            <span class="precio">$1,500.00</span>
            <button type="button" class="btn btn-agregar" data-id="cpu_basico" data-nombre="Procesador Básico" data-precio="1500" data-img="img/cpu.jpg">Agregar al carrito</button>
          </div>
        </article>
        <article class="producto">
          <img src="img/ram.jpg" alt="Producto de prueba 2">
          <div class="producto-info">
            <h3>Memoria RAM DDR4 8GB</h3>
            <span class="precio">$600.00</span>
            <button type="button" class="btn btn-agregar" data-id="ram_ddr4" data-nombre="Memoria RAM DDR4 8GB" data-precio="600" data-img="img/ram.jpg">Agregar al carrito</button>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 TechHub &mdash; Proyecto escolar de comercio electrónico.</p>
  </footer>

  <script src="js/counter.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/busqueda.js"></script>
</body>
</html>
